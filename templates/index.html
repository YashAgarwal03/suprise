<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Happy Birthday 💙</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <div class="background-hearts">
        💙
    </div>

    <main class="page">

        <div class="card first-card">

            <div class="small-cake">🎂</div>

            <p class="little-text">
                Today is a very special day...
            </p>

            <h1>
                Happy Birthday
            </h1>

            <h2>
                To My Beautiful Sister 💙
            </h2>

            <div class="sparkles">
                ✨ 🦋 ✨
            </div>

            <p class="intro">
                A little surprise has been prepared
                especially for you. 💙
            </p>

            <!-- THREE PHOTOS -->

            <div class="photo-grid three-photos">

                <div class="photo photo-one">
                    <img src="{{ url_for('static', filename='images/sister1.jpg') }}"
                         alt="Birthday girl">
                </div>

                <div class="photo photo-two">
                    <img src="{{ url_for('static', filename='images/sister2.jpg') }}"
                         alt="Birthday girl">
                </div>

                <div class="photo photo-three">
                    <img src="{{ url_for('static', filename='images/sister3.jpg') }}"
                         alt="Birthday girl">
                </div>

            </div>

            <p class="bottom-text">
                Because someone as special as you deserves
                more than just a simple birthday wish. 🌸
            </p>

            <a href="{{ url_for('birthday') }}"
               class="main-button">
                Next 💙
            </a>

        </div>

    </main>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>

</body>
</html>
